# ==============================================================================
# application.properties
# ==============================================================================
# Archivo central de configuración de Spring Boot. Spring Boot lo lee
# automáticamente al arrancar (busca src/main/resources/application.properties)
# y usa sus valores para configurar los distintos módulos (servidor web,
# base de datos, JPA/Hibernate, Thymeleaf, seguridad, logging, etc.)
# sin que tengamos que escribir código Java de configuración manual para
# cada cosa básica.
# ==============================================================================

# ------------------------------------------------------------------------------
# INFORMACIÓN GENERAL DE LA APLICACIÓN
# ------------------------------------------------------------------------------
# Nombre lógico de la aplicación (aparece en logs, actuator, etc.)
spring.application.name=spark-admin-app

# Puerto en el que se levanta el servidor Tomcat embebido.
# http://localhost:8080
server.port=8080

# ------------------------------------------------------------------------------
# BASE DE DATOS: H2 EN MEMORIA (ideal para pruebas locales / desarrollo)
# ------------------------------------------------------------------------------
# URL de conexión JDBC. "mem:sparkadmindb" crea una base de datos en memoria
# llamada "sparkadmindb": se crea vacía al arrancar la app y se destruye al
# apagarla (útil para desarrollo, no persiste entre reinicios).
#
# DB_CLOSE_DELAY=-1  -> evita que H2 cierre/destruya la base de datos cuando
#                       la primera conexión se cierra (importante en apps web
#                       donde las conexiones se abren y cierran constantemente
#                       por cada petición).
spring.datasource.url=jdbc:h2:mem:sparkadmindb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Alternativa: MySQL real para un entorno más "productivo" -----------------
# Para usar MySQL en lugar de H2:
#   1) Descomentar la dependencia mysql-connector-j en el pom.xml
#   2) Comentar el bloque H2 de arriba y descomentar este bloque, ajustando
#      host, puerto, nombre de base de datos, usuario y contraseña reales.
#
# spring.datasource.url=jdbc:mysql://localhost:3306/sparkadmindb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# CONSOLA WEB DE H2 (solo para desarrollo/depuración)
# ------------------------------------------------------------------------------
# Habilita una consola web accesible en http://localhost:8080/h2-console
# desde donde se puede inspeccionar visualmente la base de datos en memoria
# (ver tablas, ejecutar consultas SQL, revisar los datos de PERSONA, etc.)
# Usar como "JDBC URL" el mismo valor de spring.datasource.url de arriba.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------------------------
# ddl-auto=update -> Hibernate revisa las entidades (@Entity) y actualiza
# automáticamente el esquema de la base de datos (crea/ajusta tablas y
# columnas) para que coincida con las clases Java. Muy cómodo en desarrollo;
# en un entorno productivo real se recomienda usar migraciones controladas
# (Flyway/Liquibase) en lugar de "update".
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL generado por Hibernate (útil para aprender y
# depurar qué sentencias se están ejecutando realmente contra la BD).
spring.jpa.show-sql=true
# Da formato "bonito" (multilinea, indentado) al SQL mostrado en consola.
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico para H2: le indica a Hibernate qué "dialecto" SQL debe
# generar (cada motor de base de datos tiene pequeñas particularidades de
# sintaxis SQL).
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ------------------------------------------------------------------------------
# THYMELEAF
# ------------------------------------------------------------------------------
# Desactiva el cache de plantillas: cada vez que se recarga una página en el
# navegador, Thymeleaf vuelve a leer el archivo .html desde disco. Esto es
# muy útil en desarrollo porque los cambios en las vistas se ven al instante
# sin tener que reiniciar la aplicación. En producción normalmente se pone
# en "true" por rendimiento.
spring.thymeleaf.cache=false

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
# Sube el nivel de detalle de los logs de Spring Security a DEBUG, para
# poder observar en la consola el proceso interno de autenticación
# (intentos de login, excepciones lanzadas, etc.) mientras se desarrolla
# y se depura la lógica de bloqueo de cuentas.
logging.level.org.springframework.security=DEBUG
