<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<main class="acceso">
    <section class="acceso-cancha">
        <p class="mb-3"><i class="bi bi-shield-fill-check fs-2" style="color:#ff7a1a" aria-hidden="true"></i></p>
        <h1>Portería, socios y cuotas en un solo sistema.</h1>
        <p class="mt-3">Ingresa con tu usuario de empleado para controlar accesos y gestionar el club.</p>
    </section>

    <section class="acceso-form">
        <div class="caja">
            <h2 class="mb-1">Ingresar</h2>
            <p class="text-secondary mb-4">Usa tu usuario y contraseña de empleado.</p>

            <div class="alert alert-danger" role="alert" th:if="${param.error}">
                El usuario o la contraseña no coinciden. Revisa los datos e intenta de nuevo.
            </div>
            <div class="alert alert-info" role="status" th:if="${param.logout}">
                Cerraste sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-cancha w-100">Ingresar</button>
            </form>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
