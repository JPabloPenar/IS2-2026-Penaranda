# =============================================================================
# application.properties - Club Deportivo
# Los valores ${VARIABLE:defecto} se sobrescriben con variables de entorno, para
# no dejar credenciales reales en el repositorio.
# =============================================================================
spring.application.name=club-deportivo
server.port=8080

# ------------------------------- Servidor web --------------------------------
# Parametros que se ajustan al buscar el punto de saturacion (ver docs/PRUEBAS_CARGA_Y_STRESS.md)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ------------------------------- MySQL 8 --------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:club_deportivo}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Pool HikariCP: si se agota bajo carga, las peticiones esperan (metrica hikaricp.connections.pending)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

# ------------------------------- JPA / Hibernate ------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Sin Open-Session-In-View: los servicios cargan todo dentro de @Transactional y las
# vistas solo reciben DTOs, nunca entidades con proxies perezosos.
spring.jpa.open-in-view=false

# ------------------------------- Thymeleaf ------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ------------------------------- Subida de archivos (fotos de rostro) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.file-size-threshold=512KB

# Carpeta local donde se guardan las fotos. Para un entorno cloud, reemplazar la
# implementacion de FileStorageService (p. ej. S3) sin tocar el resto del sistema.
club.storage.ruta-fotos=${CLUB_FOTOS_DIR:./uploads/fotos}
# Debe coincidir con max-file-size (2 MB = 2097152 bytes)
club.storage.max-bytes=2097152

# ------------------------------- Usuario administrador inicial -----------------
# Se crea SOLO si no existe ningun usuario. CAMBIAR la clave antes de usar en produccion.
club.admin.username=${CLUB_ADMIN_USER:admin}
club.admin.password=${CLUB_ADMIN_PASSWORD:Admin1234}

# ------------------------------- Actuator (metricas) --------------------------
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
