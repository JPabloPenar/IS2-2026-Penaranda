# =============================================================================
# application.properties - Configuración del Sistema Escolar
# Los valores con ${VARIABLE:defecto} se pueden sobrescribir con variables de
# entorno, así no se guardan credenciales reales en el repositorio.
# =============================================================================

spring.application.name=sistema-escolar
server.port=8080

# ----------------------------- Base de datos MySQL 8 -------------------------
# createDatabaseIfNotExist=true crea el esquema la primera vez si el usuario tiene permisos.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sistema_escolar}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------- JPA / Hibernate --------------------------------
# update: Hibernate crea/ajusta las tablas según las entidades (usar "validate" en producción).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Desactivamos Open-Session-In-View: toda la carga de datos ocurre dentro de la capa de servicio
# (@Transactional) y las vistas solo reciben DTOs, nunca entidades con proxies perezosos.
spring.jpa.open-in-view=false

# ----------------------------- Thymeleaf --------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----------------------------- Codificación HTTP ------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ----------------------------- Correo (SMTP) ----------------------------------
# OPCIÓN A (recomendada para desarrollo): Mailtrap Sandbox. Los correos no salen a Internet,
# quedan en la bandeja de pruebas de tu cuenta de Mailtrap.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:tu_usuario_mailtrap}
spring.mail.password=${MAIL_PASSWORD:tu_password_mailtrap}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OPCIÓN B: Gmail (requiere "Contraseña de aplicación" con verificación en 2 pasos activada).
# MAIL_HOST=smtp.gmail.com  MAIL_PORT=587  MAIL_USERNAME=tucuenta@gmail.com  MAIL_PASSWORD=<app password>

# Parámetros propios de la aplicación (leídos con @Value en EmailServiceImpl)
app.mail.from=${MAIL_FROM:no-reply@colegio.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}
