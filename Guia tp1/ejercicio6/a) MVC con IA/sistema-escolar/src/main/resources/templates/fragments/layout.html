<!DOCTYPE html>
<!--
  layout.html - Fragmentos reutilizables (cabecera, barra lateral, mensajes, pie y scripts).
  Cada página los incorpora con th:replace="~{fragments/layout :: nombreDelFragmento}".
  Así el diseño se mantiene en UN solo lugar.
-->
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== Cabecera <head>: recibe el título de la página como parámetro ===== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Sistema Escolar'">Sistema Escolar</title>

    <!-- Bootstrap 5 y Bootstrap Icons desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Tipografías: Literata (títulos) y Public Sans (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- Estilos propios (@{...} genera la URL correcta respetando el context-path) -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<!-- ===== Barra lateral: recibe la sección activa para resaltarla ===== -->
<aside th:fragment="sidebar(activo)" class="sidebar">
    <a class="sidebar-brand" th:href="@{/dashboard}">
        <i class="bi bi-journal-bookmark-fill" aria-hidden="true"></i>
        <span>Sistema Escolar<small>Cuaderno del docente</small></span>
    </a>

    <nav class="nav flex-column" aria-label="Principal">
        <a class="nav-link" th:classappend="${activo == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
            <i class="bi bi-house-door" aria-hidden="true"></i> Panel
        </a>
        <a class="nav-link" th:classappend="${activo == 'alumnos'} ? 'active'" th:href="@{/alumnos}">
            <i class="bi bi-people" aria-hidden="true"></i> Alumnos
        </a>
        <a class="nav-link" th:classappend="${activo == 'notas'} ? 'active'" th:href="@{/notas}">
            <i class="bi bi-pencil-square" aria-hidden="true"></i> Notas
        </a>
        <a class="nav-link" th:classappend="${activo == 'perfil'} ? 'active'" th:href="@{/docentes/perfil}">
            <i class="bi bi-person-circle" aria-hidden="true"></i> Mi perfil
        </a>
        <a class="nav-link" th:classappend="${activo == 'password'} ? 'active'" th:href="@{/cambiar-password}">
            <i class="bi bi-key" aria-hidden="true"></i> Cambiar contraseña
        </a>
    </nav>

    <div class="sidebar-footer">
        <!-- sec:authentication="name" imprime el username (email) del usuario autenticado -->
        <div class="quien">Sesión iniciada como <strong sec:authentication="name">docente@colegio.com</strong></div>
        <!-- El logout debe ser POST; th:action agrega el token CSRF automáticamente -->
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                <i class="bi bi-box-arrow-left" aria-hidden="true"></i> Cerrar sesión
            </button>
        </form>
    </div>
</aside>

<!-- ===== Mensajes flash (éxito) que llegan desde los controladores tras una redirección ===== -->
<div th:fragment="mensajes">
    <div class="alert alert-success toast-msg alert-dismissible fade show" role="status" th:if="${mensajeExito}">
        <span th:text="${mensajeExito}">Operación realizada.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<!-- ===== Pie de página ===== -->
<footer th:fragment="footer" class="pie">
    Sistema Escolar. Las notas se guardan con el nombre del docente que las registra.
</footer>

<!-- ===== Scripts al final del <body> ===== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
