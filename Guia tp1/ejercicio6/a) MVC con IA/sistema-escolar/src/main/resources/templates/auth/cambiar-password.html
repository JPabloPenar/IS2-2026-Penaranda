<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cambiar contraseña')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('password')}"></aside>

    <div class="main-content">
        <main class="contenido">
            <div class="page-head">
                <div>
                    <h1>Cambiar contraseña</h1>
                    <p>Por seguridad, primero confirma la contraseña que usas hoy.</p>
                </div>
            </div>

            <div class="hoja formulario">
                <form th:action="@{/cambiar-password}" th:object="${cambioPassword}" method="post" novalidate>
                    <div class="mb-3">
                        <label for="passwordActual" class="form-label">Contraseña actual</label>
                        <input type="password" class="form-control" th:field="*{passwordActual}" th:errorclass="is-invalid" autocomplete="current-password">
                        <div class="error-campo" th:errors="*{passwordActual}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="nuevaPassword" class="form-label">Nueva contraseña</label>
                        <input type="password" class="form-control" th:field="*{nuevaPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
                        <div class="error-campo" th:errors="*{nuevaPassword}"></div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmarPassword" class="form-label">Repite la nueva contraseña</label>
                        <input type="password" class="form-control" th:field="*{confirmarPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="error-campo" th:errors="*{confirmarPassword}"></div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-tinta">Guardar contraseña</button>
                        <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
