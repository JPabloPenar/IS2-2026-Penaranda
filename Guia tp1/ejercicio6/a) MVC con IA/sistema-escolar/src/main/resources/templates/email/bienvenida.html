<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Bienvenida</title></head>
<body style="margin:0;padding:24px;background:#f2f5fa;font-family:Arial,Helvetica,sans-serif;color:#1f2a3d;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d5deec;border-radius:8px;">
    <tr>
        <td style="background:#1b2b4b;color:#ffffff;padding:20px 28px;font-size:18px;font-weight:bold;border-radius:8px 8px 0 0;">
            Sistema Escolar
        </td>
    </tr>
    <tr>
        <td style="padding:28px;line-height:1.6;font-size:15px;">
            <h1 style="margin:0 0 12px;font-size:22px;color:#1b2b4b;">Hola, <span th:text="${nombre}">Docente</span></h1>
            <p style="margin:0 0 12px;">Tu cuenta ya está lista. Desde el sistema puedes registrar alumnos y cargar sus calificaciones.</p>
            <p style="margin:0 0 24px;">Ingresa con el email con el que te registraste.</p>
            <a th:href="${urlLogin}" href="#"
               style="display:inline-block;background:#ffd84a;color:#1b2b4b;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:6px;">
                Ingresar al sistema
            </a>
            <p style="margin:24px 0 0;font-size:13px;color:#5b6982;">Si no creaste esta cuenta, puedes ignorar este mensaje.</p>
        </td>
    </tr>
</table>
</body>
</html>
